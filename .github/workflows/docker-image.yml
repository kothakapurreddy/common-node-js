name: Build and Deploy to GKE

on:
  push:
    branches:
      - master

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    env:
      PROJECT_ID: healthcare-488108
      GAR_LOCATION: us-east1
      GAR_REPOSITORY: sanjeev
      IMAGE_NAME: nodejs-app
      GKE_CLUSTER: Ravi_Cluster
      GKE_LOCATION: us-east1

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.GCP_CREDENTIALS }}'

      - name: Setup Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker
        run: |
          gcloud auth configure-docker us-east1-docker.pkg.dev --quiet

      - name: Build Docker Image
        run: |
          docker build \
          -t us-east1-docker.pkg.dev/healthcare-488108/sanjeev/nodejs-app:${{ github.sha }} .

      - name: Push Docker Image
        run: |
          docker push us-east1-docker.pkg.dev/healthcare-488108/sanjeev/nodejs-app:${{ github.sha }}

      - name: Get GKE Credentials
        run: |
          gcloud container clusters get-credentials $GKE_CLUSTER \
            --region $GKE_LOCATION \
            --project $PROJECT_ID

      - name: Deploy to GKE
        run: |
          kubectl apply -f deployment.yaml
          kubectl apply -f service.yaml

      - name: Verify Deployment
        run: |
          kubectl rollout status deployment/nodejs-app
