name: Build and Deploy to GKE

on:
  push:
    branches:
      - master

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    env:
      PROJECT_ID: healthcare-488108
      GAR_LOCATION: us-east1
      GAR_REPOSITORY: sanjeev
      IMAGE_NAME: nodejs-app

    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.GCP_CREDENTIALS }}'

      - uses: google-github-actions/setup-gcloud@v2

      - uses: azure/setup-kubectl@v4
        with:
          version: latest

      - run: |
          gcloud auth configure-docker us-east1-docker.pkg.dev --quiet

      - run: |
          docker build -t us-east1-docker.pkg.dev/$PROJECT_ID/$GAR_REPOSITORY/$IMAGE_NAME:${{ github.sha }} .
          docker push us-east1-docker.pkg.dev/$PROJECT_ID/$GAR_REPOSITORY/$IMAGE_NAME:${{ github.sha }}

      - uses: google-github-actions/get-gke-credentials@v3
        with:
          cluster_name: ravicluster
          location: us-east1
          project_id: healthcare-488108

      - run: kubectl apply -f deployment.yaml
      - run: kubectl apply -f service.yaml
