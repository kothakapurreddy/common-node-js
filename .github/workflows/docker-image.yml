name: Build and Deploy to GKE

on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    env:
      PROJECT_ID: healthcare-488108
      GAR_LOCATION: us-east1
      GAR_REPOSITORY: sanjeev
      IMAGE_NAME: nodejs-app
      GKE_CLUSTER: ravicluster
      GKE_LOCATION: us-east1

    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.GCP_CREDENTIALS }}'

      - uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker
        run: |
          gcloud auth configure-docker us-east1-docker.pkg.dev --quiet

      - name: Build Image
        run: |
          docker build -t us-east1-docker.pkg.dev/$PROJECT_ID/$GAR_REPOSITORY/$IMAGE_NAME:${{ github.sha }} .

      - name: Push Image
        run: |
          docker push us-east1-docker.pkg.dev/$PROJECT_ID/$GAR_REPOSITORY/$IMAGE_NAME:${{ github.sha }}

      - name: Get GKE Credentials
        uses: google-github-actions/get-gke-credentials@v3
        with:
          cluster_name: ravicluster
          location: us-east1
          project_id: healthcare-488108

      - name: Deploy
        run: |
          kubectl apply -f deployment.yaml
          kubectl apply -f service.yaml

      - name: Verify
        run: |
          kubectl rollout status deployment/nodejs-app
