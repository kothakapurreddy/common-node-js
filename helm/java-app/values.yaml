replicaCount: 2

image:
  repository: us-central1-docker.pkg.dev/healthcare-488108/devops-repo/java-app
  tag: "latest"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 8080
  targetPort: 8080

resources:
  requests:
    cpu: 250m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 70

ingress:
  enabled: false

serviceAccount:
  create: true
  name: ""

env:
  APP_ENV: "default"
